<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#071b33">
<meta name="description" content="Relatório Diário de Operações — Controle Sonda/Poço. Cálculos derivados de fonte única e reproduzíveis.">

<title>Relatório Diário de Operações</title>
<style id="estilos">
/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --azul:#071b33; --azul2:#0d2c52; --azul3:#14406f;
 --vermelho:#d92d20; --laranja:#e8890c; --verde:#1f9d55; --ciano:#1d8fb8;
 --roxo:#7b4fc9; --cinza:#7a8794;
 --borda:#d7dee6; --fundo:#eef2f6; --texto:#0f2136; --texto2:#5a6b7d;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 background:var(--fundo); color:var(--texto); -webkit-font-smoothing:antialiased;
 padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ============================================================
   BARRA SUPERIOR / ABAS
   ============================================================ */
.topo{
 position:sticky;top:0;z-index:50;background:var(--azul);color:#fff;
 padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.topo h1{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.15;flex:1 1 160px}
.topo h1 span{display:block;font-size:11px;font-weight:600;color:#7fc4e8;letter-spacing:1px}
.abas{display:flex;gap:6px}
.aba{
 background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;
 padding:9px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;
}
.aba[aria-selected="true"]{background:#2f9fd0;border-color:#2f9fd0}
.acoes{display:flex;gap:6px;width:100%}
.acoes button{
 flex:1;background:#1f7fae;border:none;color:#fff;padding:10px;border-radius:9px;
 font-weight:700;font-size:13px;cursor:pointer;
}
.acoes button.sec{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}

/* ============================================================
   EDITOR
   ============================================================ */
.painel{padding:14px;max-width:820px;margin:0 auto}
.bloco{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:14px}
.bloco > h2{
 font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--azul3);
 text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;
 justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sub{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--azul3);
 text-transform:uppercase;border-top:1px solid var(--borda);padding-top:9px;margin-top:2px}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--texto2);letter-spacing:.4px}
label.campo > input, label.campo > select, label.campo > textarea{
 border:1px solid var(--borda);border-radius:9px;padding:10px;font-size:15px;
 font-weight:600;background:#fbfcfe;width:100%;
}
label.campo > input:focus, label.campo > select:focus, label.campo > textarea:focus{
 outline:2px solid #2f9fd0;outline-offset:1px;background:#fff
}
label.campo textarea{min-height:64px;resize:vertical;font-weight:500;line-height:1.4}
label.linha{flex-direction:row;align-items:center;gap:8px;font-size:12px}
label.linha input{width:auto}
.cartao{border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafcfe}
.cartao .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cartao .cab strong{font-size:13px;color:var(--azul3)}
.btAdd{background:#1f7fae;border:none;color:#fff;padding:8px 14px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}
.btDel{background:#fdecea;border:1px solid #f5c2bd;color:#c0271c;padding:6px 11px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}

.valida{border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
.valida.ok{background:#eaf7ef;border:1px solid #b6e0c4;color:#14603a}
.valida.aviso{background:#fff6e6;border:1px solid #f2d69a;color:#7a5210}
.valida.erro{background:#fdecea;border:1px solid #f5c2bd;color:#8f1d14}
.valida ul{margin:8px 0 0 18px}
.valida li{margin-bottom:5px}
.valida .titulo{font-weight:800;letter-spacing:.4px}

/* ============================================================
   RELATÓRIO — largura fixa de 1000px, escalado para caber na tela
   ============================================================ */
.molduraRel{overflow:hidden;padding:14px 0}
.escala{transform-origin:top center;margin:0 auto;width:1000px}
/* A fonte precisa estar declarada AQUI, e não só em body: na exportação PNG apenas o
   #relatorio é serializado para dentro do SVG, então regras aplicadas a body não chegam
   junto e o texto sairia com a fonte serifada padrão do navegador. */
#relatorio{
 width:1000px;background:#eef2f6;padding:14px;font-size:13px;color:var(--texto);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.rCab{
 background:linear-gradient(90deg,var(--azul) 0%,var(--azul2) 100%);color:#fff;
 border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;
 align-items:center;gap:16px;margin-bottom:10px;
}
.rCab .tit{font-size:27px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.rCab .st{font-size:13px;font-weight:700;color:#7fc4e8;letter-spacing:1.4px;margin-top:5px}
.rCab .badge{
 background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.26);border-radius:12px;
 padding:10px 18px;text-align:center;min-width:126px;
}
.rCab .badge b{display:block;font-size:34px;font-weight:900;line-height:1}
.rCab .badge span{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#cfe6f5}

.faixa{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:12px 10px;text-align:center;border-top:4px solid var(--cinza)}
.kpi .r{font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--texto2);text-transform:uppercase;line-height:1.25;min-height:25px}
.kpi .v{font-size:31px;font-weight:900;line-height:1.05;margin-top:4px}
.kpi .p{font-size:10.5px;font-weight:800;margin-top:2px;color:var(--texto2);line-height:1.3}
.kpi.c{border-top-color:var(--vermelho)} .kpi.c .v{color:var(--vermelho)}
.kpi.a{border-top-color:var(--laranja)} .kpi.a .v{color:var(--laranja)}
.kpi.n{border-top-color:var(--verde)}   .kpi.n .v{color:var(--verde)}
.kpi.i{border-top-color:var(--azul3)}   .kpi.i .v{color:var(--azul3)}

.trio{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;margin-bottom:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cx{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cx > h3{
 background:var(--azul2);color:#fff;font-size:11px;font-weight:800;letter-spacing:1.1px;
 padding:9px 12px;text-align:center;text-transform:uppercase;
}
.cx .corpo{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:center}
.legenda{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.legenda i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.legenda div{display:flex;align-items:center;gap:7px}
.legenda .q{margin-left:auto;color:var(--texto2);font-weight:800;font-size:11px}
.rosca{display:flex;align-items:center;gap:12px}

table.st{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
table.st th{
 background:var(--azul2);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.7px;
 padding:8px 5px;text-transform:uppercase;
}
table.st td{padding:8px 5px;border-bottom:1px solid #e6ecf2;text-align:center;font-weight:600}
table.st td.esq{text-align:left}
table.st tr:last-child td{border-bottom:none}
table.eq{width:100%;border-collapse:collapse;font-size:11px;background:#fff}
table.eq th{background:var(--azul3);color:#fff;font-size:9px;font-weight:800;letter-spacing:.6px;padding:7px 5px;text-transform:uppercase}
table.eq td{padding:7px 5px;border-bottom:1px solid #e6ecf2;text-align:left;font-weight:600}
table.eq tr:last-child td{border-bottom:none}
.selo{display:inline-block;padding:4px 10px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:.6px;color:#fff}
.selo.c{background:var(--vermelho)} .selo.a{background:var(--laranja)} .selo.n{background:var(--verde)}
.selo.dtm{background:var(--ciano)}
.dias{font-weight:900;font-size:14px}
.dias.c{color:var(--vermelho)} .dias.a{color:var(--laranja)} .dias.n{color:var(--verde)}
.dias.dtm{color:var(--ciano);font-size:10px;font-weight:800;letter-spacing:.5px}
.vazio{color:#9aa7b4;font-weight:600;font-style:italic;font-size:10.5px}

.lista{padding:12px 14px;font-size:12px;line-height:1.5}
.lista .it{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.lista .it:last-child{margin-bottom:0}
.lista .pt{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.lista .num{
 width:19px;height:19px;border-radius:50%;background:var(--azul3);color:#fff;flex:none;
 font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.rodape{
 background:var(--azul);color:#fff;border-radius:12px;padding:12px 18px;display:flex;
 justify-content:space-between;align-items:center;gap:14px;font-size:11px;font-weight:800;
 letter-spacing:.7px;flex-wrap:wrap;
}
.rodape .car{font-weight:600;letter-spacing:.2px;color:#9fc6de;font-size:10px;text-align:right}
.nota{font-size:9.5px;color:var(--texto2);font-weight:600;padding:0 12px 9px;text-align:center;line-height:1.35}

.oculto{display:none!important}
@media print{
 .topo,.painel{display:none!important}
 body{background:#fff}
 .molduraRel{padding:0}
 .escala{transform:none!important;width:1000px}
}
</style>

<body>

<header class="topo">
 <h1>RELATÓRIO DIÁRIO<span>CONTROLE SONDA — POÇO</span></h1>
 <div class="abas" role="tablist">
  <button class="aba" id="abaEditor" role="tab" aria-selected="true" type="button">Editor</button>
  <button class="aba" id="abaRel" role="tab" aria-selected="false" type="button">Relatório</button>
 </div>
 <div class="acoes">
  <button id="btPng" type="button">Exportar PNG</button>
  <button id="btPdf" class="sec" type="button">Salvar PDF</button>
  <button id="btJson" class="sec" type="button">Backup</button>
 </div>
</header>

<main>
 <section class="painel" id="paneEditor"></section>
 <section class="molduraRel oculto" id="paneRel">
  <div class="escala" id="escala"><div id="relatorio"></div></div>
 </section>
</main>

<input type="file" id="arqJson" accept="application/json" class="oculto">

<script>
(function(){
'use strict';

/* ============================================================
   1. NÚCLEO DE CÁLCULO — funções puras, sem DOM
   ------------------------------------------------------------
   Tudo que aparece no relatório sai daqui, e daqui sai de UMA
   única fonte: o objeto `estado`. Foi essa a correção do achado
   crítico 2 da auditoria (dois gráficos discordando entre si):
   se todo gráfico deriva da mesma tabela, é impossível divergirem.
   Este bloco é espelhado em verificacao_nucleo.js para teste
   automatizado em Node.
   ============================================================ */

const DIA_MS = 86400000;

/* Datas são convertidas para UTC a partir dos componentes, tanto o
   fechamento quanto o início de cada sonda. Como os dois lados usam
   exatamente a mesma conversão, a diferença entre eles é exata e não
   depende do fuso do aparelho — o mesmo relatório aberto em qualquer
   lugar do mundo mostra os mesmos dias de operação. */
function msDe(dataISO, horaHM){
 if(!dataISO) return NaN;
 const [a,m,d] = String(dataISO).split('-').map(Number);
 const [h,min] = String(horaHM||'00:00').split(':').map(Number);
 if(![a,m,d].every(Number.isFinite)) return NaN;
 return Date.UTC(a, m-1, d, h||0, min||0);
}
function msDeInicio(valor){
 if(!valor) return NaN;
 const [data,hora] = String(valor).split('T');
 return msDe(data, hora);
}

/* CORREÇÃO DO ACHADO CRÍTICO 1 — o instante de referência é o
   fechamento DECLARADO do relatório, nunca Date.now(). O relatório
   passa a ser um documento reproduzível: reabrir daqui a um ano
   mostra exatamente os mesmos números. */
function msFechamento(cfg){ return msDe(cfg.dataRelatorio, cfg.horaFechamento); }

/* Os dias de operação contam a partir do INÍCIO DA INTERVENÇÃO.
   Enquanto a sonda está em DTM (desmontagem/transporte/montagem) a
   intervenção ainda não começou, então não existe dia de intervenção
   a contar — a sonda aparece marcada como "EM DTM" e fica fora do
   ranking de exposição, em vez de receber um número inventado. */
function diasDeIntervencao(sonda, refMs){
 const ini = msDeInicio(sonda.inicioIntervencao);
 if(!Number.isFinite(ini) || !Number.isFinite(refMs)) return null;
 return (refMs - ini)/DIA_MS;
}

/* Duração do DTM em horas. Se o DTM começou mas ainda não terminou,
   devolve o tempo decorrido até o fechamento e marca emAndamento. */
function duracaoDTM(sonda, refMs){
 const i = msDeInicio(sonda.inicioDTM);
 if(!Number.isFinite(i)) return null;
 const f = msDeInicio(sonda.fimDTM);
 if(Number.isFinite(f)) return {emAndamento:false, horas:(f-i)/3600000};
 if(!Number.isFinite(refMs)) return null;
 return {emAndamento:true, horas:(refMs-i)/3600000};
}

function contarPor(itens, chave){
 const m = new Map();
 itens.forEach(it=>{
  const k = String(chave(it)||'').trim().toUpperCase() || '(NÃO INFORMADO)';
  m.set(k, (m.get(k)||0)+1);
 });
 return [...m.entries()].map(([rotulo,qtd])=>({rotulo,qtd})).sort((a,b)=>b.qtd-a.qtd);
}

/* Percentuais SEMPRE derivados da quantidade — nunca digitados
   (achado crítico latente 1). Quantidades iguais produzem
   percentuais iguais por construção, o que corrige o achado
   "29% e 28% para duas categorias de 2 sondas". */
function comPercentual(itens, total){
 return itens.map(it=>({...it, pct: total>0 ? it.qtd/total*100 : 0}));
}
function somaArredondada(itens){
 return itens.reduce((s,it)=>s+Math.round(it.pct),0);
}

const PALETA = ['#d92d20','#e8890c','#1f9d55','#1d8fb8','#7b4fc9','#7a8794','#0d9488','#b45309'];
function colorir(itens, cores){
 return itens.map((it,i)=>({...it, cor: (cores && cores[i]) || PALETA[i % PALETA.length]}));
}

function computar(estado){
 const cfg = estado.config;
 const refMs = msFechamento(cfg);

 /* ---- sondas com dias e DTM calculados ---- */
 const sondas = estado.sondas.map(s=>{
  const dias = diasDeIntervencao(s, refMs);
  const emDTM = dias === null;
  const prod = (s.semMedicao || s.producao === '' || s.producao === null) ? null : Number(s.producao);
  return {
   ...s,
   dias,
   emDTM,
   diasInvalido: !emDTM && dias < 0,
   dtm: duracaoDTM(s, refMs),
   producaoNum: Number.isFinite(prod) ? prod : null
  };
 });
 const total = sondas.length;
 const emIntervencao = sondas.filter(s=>!s.emDTM).length;
 const emDTM = total - emIntervencao;

 /* ---- criticidade ---- */
 const ORDEM_CRIT = [
  {chave:'critica', rotulo:'CRÍTICAS', cor:'#d92d20'},
  {chave:'atencao', rotulo:'ATENÇÃO',  cor:'#e8890c'},
  {chave:'normal',  rotulo:'NORMAIS',  cor:'#1f9d55'}
 ];
 const criticidade = comPercentual(
  ORDEM_CRIT.map(c=>({...c, qtd: sondas.filter(s=>s.criticidade===c.chave).length})),
  total
 );

 /* ---- as duas roscas mostram DIMENSÕES DIFERENTES, cada uma somando
        o total de sondas (correção do achado crítico 2) ---- */
 const porOperacao = colorir(comPercentual(contarPor(sondas, s=>s.operacao), total),
                             ['#1d8fb8','#1f9d55','#e8890c','#7b4fc9','#7a8794']);
 const porSituacao = colorir(comPercentual(contarPor(sondas, s=>s.situacao), total));

 /* ---- produção: soma só o que tem medição (achado 5) ---- */
 const comMedicao = sondas.filter(s=>s.producaoNum !== null);
 const producaoTotal = comMedicao.reduce((a,s)=>a+s.producaoNum, 0);

 /* ---- poços entregues ---- */
 const entregues = estado.entregues.map(e=>({
  ...e,
  entregue: Number(e.entregue)||0,
  meta: Number(e.meta)||0
 }));
 const totalEntregue = entregues.reduce((a,e)=>a+e.entregue, 0);
 const totalMeta = entregues.reduce((a,e)=>a+e.meta, 0);
 /* proteção contra divisão por zero (achado 6) */
 const atingimento = totalMeta > 0 ? totalEntregue/totalMeta*100 : null;

 /* ---- NPT ---- */
 const nptItens = estado.npt.map(n=>({rotulo:n.tipo, qtd:Number(n.qtd)||0}));
 const totalNpt = nptItens.reduce((a,n)=>a+n.qtd, 0);
 const npt = colorir(comPercentual(nptItens, totalNpt), ['#d92d20','#e8890c','#1d8fb8','#7b4fc9']);

 /* ---- TOP maior exposição: só quem já está em intervenção ---- */
 const top = sondas.filter(s=>!s.emDTM && !s.diasInvalido).slice().sort((a,b)=>b.dias-a.dias).slice(0,3);

 /* ---- nota de arredondamento: só aparece quando é necessária ---- */
 const precisaNotaPct = [criticidade, porOperacao, porSituacao, npt]
   .some(g=> g.length>0 && somaArredondada(g) !== 100);

 return {
  refMs, sondas, total, emIntervencao, emDTM, criticidade, porOperacao, porSituacao,
  producaoTotal, qtdComMedicao: comMedicao.length, qtdSemMedicao: total - comMedicao.length,
  entregues, totalEntregue, totalMeta, atingimento,
  npt, totalNpt, top, precisaNotaPct
 };
}

/* ============================================================
   2. VALIDAÇÃO — o que a auditoria teria pego sozinha
   ============================================================ */
function validar(estado, c){
 const erros = [], avisos = [], oks = [];

 if(!Number.isFinite(c.refMs)){
  erros.push('Data ou hora de fechamento inválida — nenhum dia de operação pode ser calculado.');
 }
 c.sondas.forEach(s=>{
  const nome = s.sonda || '(sonda sem nome)';
  if(s.diasInvalido){
   erros.push(`${nome}: início da intervenção é posterior ao fechamento do relatório (dias negativos).`);
  }
  if(s.emDTM){
   const quanto = s.dtm ? ` há ${(s.dtm.horas/24).toFixed(2)} dia(s)` : '';
   avisos.push(`${nome}: em DTM${quanto}, sem início de intervenção. Não entra no cálculo de dias de intervenção nem no TOP 3.`);
  }
  if(!String(s.operacao||'').trim()) avisos.push(`${nome}: operação não informada.`);
  if(!String(s.situacao||'').trim()) avisos.push(`${nome}: situação/observação não informada.`);
  if(!s.emDTM && s.producaoNum === null && !s.semMedicao){
   avisos.push(`${nome}: produção em branco. Marque "sem medição" ou informe 0 — em branco não entra no total do campo.`);
  }
 });

 /* sonda exposta há muito tempo sem estar marcada como crítica */
 const limite = Number(estado.config.limiteDias)||0;
 if(limite > 0){
  c.sondas.forEach(s=>{
   if(!s.emDTM && !s.diasInvalido && s.dias >= limite && s.criticidade !== 'critica'){
    avisos.push(`${s.sonda}: ${s.dias.toFixed(2)} dias de intervenção (limite ${limite}) mas está marcada como "${s.criticidade==='atencao'?'Atenção':'Normal'}". Confirme a criticidade.`);
   }
  });
 }

 /* eventos de NPT sem descrição correspondente */
 if(c.totalNpt > 0){
  const descritos = estado.destaques.filter(d=>/npt|falha|motor|parada|quebra|interrup/i.test(d.texto)).length
                  + (/npt|falha|motor|parada|quebra|interrup/i.test(estado.notaNpt||'') ? 1 : 0);
  if(descritos < c.totalNpt){
   avisos.push(`${c.totalNpt} eventos de NPT contabilizados, mas só ${descritos} aparecem descritos nos Destaques ou na Nota NPT. Todo evento contabilizado deveria ter descrição.`);
  }
 }

 /* metas parcialmente preenchidas */
 const comMeta = c.entregues.filter(e=>e.meta>0).length;
 if(comMeta > 0 && comMeta < c.entregues.length){
  avisos.push(`Meta preenchida em ${comMeta} de ${c.entregues.length} categorias. O percentual de atingimento só considera as categorias com meta.`);
 }

 /* autoverificações que provam a fonte única de verdade */
 const somaOp = c.porOperacao.reduce((a,i)=>a+i.qtd,0);
 const somaSit = c.porSituacao.reduce((a,i)=>a+i.qtd,0);
 const somaCrit = c.criticidade.reduce((a,i)=>a+i.qtd,0);
 if(somaOp===c.total && somaSit===c.total && somaCrit===c.total){
  oks.push(`Os três agrupamentos (criticidade, operação, situação) somam exatamente ${c.total} sondas — nenhum gráfico pode contradizer a tabela.`);
 } else {
  erros.push('Falha interna: os agrupamentos não somam o total de sondas.');
 }
 oks.push(`${c.emIntervencao} sonda(s) em intervenção e ${c.emDTM} em DTM — soma ${c.emIntervencao + c.emDTM} de ${c.total}.`);
 const somaBarras = c.entregues.reduce((a,e)=>a+e.entregue,0);
 if(somaBarras === c.totalEntregue) oks.push(`Soma das barras de poços entregues = total exibido (${c.totalEntregue}).`);
 if(c.totalNpt === c.npt.reduce((a,n)=>a+n.qtd,0)) oks.push(`Soma das quantidades de NPT = total de eventos exibido (${c.totalNpt}).`);

 return {erros, avisos, oks};
}

const fmt = (n,d=0)=> Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dataBR(iso){
 if(!iso) return '—';
 const [a,m,d] = String(iso).split('-');
 return `${d}/${m}/${a}`;
}
function dataHoraBR(v, separador){
 if(!v) return '—';
 const [data,hora] = String(v).split('T');
 return `${dataBR(data)}${separador||' '}${hora||''}`;
}
function horasBR(h){
 if(h===null||h===undefined||!Number.isFinite(h)) return '—';
 const total = Math.round(h*60);
 const hh = Math.floor(total/60), mm = total%60;
 return `${hh}h${String(mm).padStart(2,'0')}`;
}
const ROTULO_CRIT = {critica:'ALTO', atencao:'ATENÇÃO', normal:'NORMAL'};
const CLASSE_CRIT = {critica:'c', atencao:'a', normal:'n'};
const COR_DESTAQUE = {critico:'#d92d20', alerta:'#e8890c', positivo:'#1f9d55', info:'#1d8fb8'};
const VAZIO = '<span class="vazio">a preencher</span>';

/* ============================================================
   5. GRÁFICOS EM SVG — sem biblioteca externa, exporta limpo
   ============================================================ */
function rosca(itens, total, centroTexto, centroRotulo){
 const S=150, r=52, C=2*Math.PI*r, cx=S/2, cy=S/2;
 let acc=0;
 const arcos = itens.filter(i=>i.qtd>0).map(i=>{
  const len = total>0 ? (i.qtd/total)*C : 0;
  const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i.cor}" stroke-width="24"
    stroke-dasharray="${len.toFixed(3)} ${(C-len).toFixed(3)}" stroke-dashoffset="${(-acc).toFixed(3)}"
    transform="rotate(-90 ${cx} ${cy})"/>`;
  acc += len; return el;
 }).join('');
 const vazio = total>0 ? '' : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e6ecf2" stroke-width="24"/>`;
 return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img">
  ${vazio}${arcos}
  <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="30" font-weight="900" fill="#0f2136">${esc(centroTexto)}</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" font-weight="800" fill="#5a6b7d" letter-spacing="1">${esc(centroRotulo)}</text>
 </svg>`;
}
function legenda(itens){
 return `<div class="legenda">${itens.filter(i=>i.qtd>0).map(i=>
  `<div><i style="background:${i.cor}"></i><span>${esc(i.rotulo)}</span><span class="q">${i.qtd} (${Math.round(i.pct)}%)</span></div>`
 ).join('')}</div>`;
}
function barrasVerticais(itens, mostrarMeta){
 const L=300, A=150, base=A-30, topo=12;
 const max = Math.max(1, ...itens.map(i=>Math.max(i.entregue, mostrarMeta?i.meta:0)));
 const passo = L/itens.length, larg = Math.min(30, passo*0.5);
 const corpo = itens.map((i,k)=>{
  const x = k*passo + passo/2;
  const h = (i.entregue/max)*(base-topo);
  const y = base-h;
  const metaEl = (mostrarMeta && i.meta>0)
   ? `<line x1="${x-larg/2-3}" y1="${base-(i.meta/max)*(base-topo)}" x2="${x+larg/2+3}" y2="${base-(i.meta/max)*(base-topo)}" stroke="#0f2136" stroke-width="2" stroke-dasharray="3 2"/>` : '';
  return `<rect x="${x-larg/2}" y="${y}" width="${larg}" height="${Math.max(h,1)}" rx="3" fill="#1d8fb8"/>
   <text x="${x}" y="${y-4}" text-anchor="middle" font-size="12" font-weight="900" fill="#0f2136">${i.entregue}</text>
   ${metaEl}
   <text x="${x}" y="${base+11}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5a6b7d">${esc(i.categoria.slice(0,13))}</text>`;
 }).join('');
 return `<svg viewBox="0 0 ${L} ${A}" width="100%" height="${A}" role="img">
  <line x1="0" y1="${base}" x2="${L}" y2="${base}" stroke="#d7dee6" stroke-width="1"/>${corpo}</svg>`;
}
/* Barras horizontais para agrupamentos com muitas categorias. Uma rosca com 8 fatias
   iguais de 13% não comunica nada — barras ordenadas comunicam. Quando as situações se
   repetem (vários poços em pescaria, por exemplo), o agrupamento aparece na hora. */
function barrasCategoria(itens){
 if(!itens.length) return '<div style="text-align:center;color:#7a8794;font-size:12px">Sem dados</div>';
 const L=300, alt=21, A=itens.length*alt+6;
 const max = Math.max(...itens.map(i=>i.qtd), 1);
 return `<svg viewBox="0 0 ${L} ${A}" width="100%" height="${A}" role="img">${itens.map((i,k)=>{
  const y = k*alt+3, w = (i.qtd/max)*(L-178);
  return `<text x="0" y="${y+12}" font-size="9" font-weight="800" fill="#0f2136">${esc(i.rotulo.slice(0,19))}</text>
   <rect x="122" y="${y+2}" width="${Math.max(w,2)}" height="12" rx="3" fill="${i.cor}"/>
   <text x="${122+Math.max(w,2)+5}" y="${y+12}" font-size="9.5" font-weight="900" fill="#5a6b7d">${i.qtd} (${Math.round(i.pct)}%)</text>`;
 }).join('')}</svg>`;
}
function barrasTop(itens){
 if(!itens.length) return '<div style="text-align:center;color:#7a8794;font-size:12px">Nenhuma sonda em intervenção</div>';
 const L=300, alt=30, A=itens.length*alt+12;
 const max = Math.max(...itens.map(i=>i.dias));
 const cores = ['#d92d20','#e8890c','#1f9d55'];
 return `<svg viewBox="0 0 ${L} ${A}" width="100%" height="${A}" role="img">${itens.map((s,k)=>{
  const y = k*alt+4, w = max>0 ? (s.dias/max)*(L-108) : 0;
  return `<text x="0" y="${y+15}" font-size="10" font-weight="800" fill="#0f2136">${k+1}º ${esc(s.sonda)}</text>
   <rect x="62" y="${y+5}" width="${Math.max(w,2)}" height="13" rx="3" fill="${cores[k]||'#7a8794'}"/>
   <text x="${62+Math.max(w,2)+5}" y="${y+15}" font-size="11" font-weight="900" fill="${cores[k]||'#7a8794'}">${fmt(s.dias,2)}</text>`;
 }).join('')}</svg>`;
}

 el.parentElement.style.height = (el.getBoundingClientRect().height) + 'px';
}
window.addEventListener('resize', ()=>{ if(!document.getElementById('paneRel').classList.contains('oculto')) ajustarEscala(); });

/* ============================================================
   7. RENDER DO EDITOR
   ============================================================ */

  ${(!v.erros.length&&!v.avisos.length)?`<div class="valida ok" style="margin-bottom:10px"><div class="titulo">✅ Nenhuma inconsistência encontrada</div></div>`:''}
  <div class="valida ok"><div class="titulo">Autoverificação</div><ul>${v.oks.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;

   <label class="campo">CATEGORIA<input data-e="${i}" data-k="categoria" value="${esc(e.categoria)}"></label>

 </div>

 <div class="bloco"><h2>Tempo não produtivo (NPT) <button class="btAdd" data-add="npt" type="button">+ Tipo</button></h2>
  ${estado.npt.length ? estado.npt.map((n,i)=>{
   const it = c.npt[i] || {pct:0};
   return `<div class="cartao"><div class="grade">
    <label class="campo" style="grid-column:1/-1">TIPO<input data-n="${i}" data-k="tipo" value="${esc(n.tipo)}"></label>
    <label class="campo">QUANTIDADE<input type="number" step="1" min="0" data-n="${i}" data-k="qtd" value="${esc(n.qtd)}"></label>

   <label class="campo" style="grid-column:1/-1">${i+1}º<textarea data-r="${i}">${esc(r)}</textarea></label>
   <div><button class="btDel" data-del="rec" data-i="${i}" type="button">Excluir</button></div>
  </div></div>`).join('') : '<div style="font-size:12.5px;color:#5a6b7d">Nenhuma recomendação ainda.</div>'}
 </div>

 <div class="bloco"><h2>Manutenção</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btAdd" id="btRestaurar" type="button">Restaurar dados de 18/08</button>
   <button class="btAdd" id="btImportar" style="background:#4b5b6b" type="button">Importar backup</button>
   <button class="btDel" id="btLimpar" type="button">Limpar tudo</button>

}

/* ============================================================
   8. EDIÇÃO — um único caminho de escrita para todos os campos
   ============================================================ */
const paneEditor = document.getElementById('paneEditor');

function aplicar(el){
 const val = el.type==='checkbox' ? el.checked : el.value;
 if(el.dataset.cfg!==undefined){ estado.config[el.dataset.cfg] = val; }
 else if(el.dataset.raiz!==undefined){ estado[el.dataset.raiz] = val; }
 else if(el.dataset.s!==undefined){ estado.sondas[+el.dataset.s][el.dataset.k] = val; }
 else if(el.dataset.e!==undefined){ estado.entregues[+el.dataset.e][el.dataset.k] = val; }
 else if(el.dataset.n!==undefined){ estado.npt[+el.dataset.n][el.dataset.k] = val; }
 else if(el.dataset.d!==undefined){ estado.destaques[+el.dataset.d][el.dataset.k] = val; }
 else if(el.dataset.r!==undefined){ estado.recomendacoes[+el.dataset.r] = val; }
 else return false;
 salvar();
 return true;
}
/* digitação: aplica e recalcula o relatório, sem redesenhar o editor
   (redesenhar faria o campo perder o foco no meio da digitação) */
paneEditor.addEventListener('input', e=>{
 if(aplicar(e.target)) renderRelatorio();
});
/* ao sair do campo / trocar seleção: redesenha o editor para atualizar
   validação, contadores e percentuais calculados */
paneEditor.addEventListener('change', e=>{
 if(aplicar(e.target)){ renderRelatorio(); renderEditor(); }
});

paneEditor.addEventListener('click', e=>{
 const add = e.target.dataset.add, del = e.target.dataset.del;
 if(add){
  if(add==='sonda') estado.sondas.push({sonda:'',poco:'',operacao:'',inicioDTM:'',fimDTM:'',inicioIntervencao:'',
   fiscal:'',engenheiro:'',coordenador:'',encarregado:'',criticidade:'normal',producao:'',semMedicao:false,runLife:'',situacao:'',proximaAcao:''});
  if(add==='entregue') estado.entregues.push({categoria:'Nova categoria',meta:0,entregue:0});
  if(add==='npt') estado.npt.push({tipo:'Novo tipo de NPT',qtd:0});
  if(add==='destaque') estado.destaques.push({cor:'info',texto:''});
  if(add==='rec') estado.recomendacoes.push('');
 } else if(del){
  const i = +e.target.dataset.i;
  const alvo = {sonda:'sondas', entregue:'entregues', npt:'npt', destaque:'destaques', rec:'recomendacoes'}[del];
  if(alvo && confirm('Excluir este item?')) estado[alvo].splice(i,1); else return;
 } else if(e.target.id==='btRestaurar'){
  if(!confirm('Substituir todos os dados atuais pelos dados de 18/08/2026?')) return;
  estado = clonar(ESTADO_PADRAO);
 } else if(e.target.id==='btLimpar'){
  if(!confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')) return;
  estado = {...clonar(ESTADO_PADRAO), sondas:[], entregues:[], npt:[], destaques:[], recomendacoes:[], notaNpt:''};
 } else if(e.target.id==='btImportar'){
  document.getElementById('arqJson').click(); return;
 } else return;
 salvar(); renderEditor(); renderRelatorio();
});

/* ============================================================
   9. ABAS
   ============================================================ */
const abaEditor = document.getElementById('abaEditor'), abaRel = document.getElementById('abaRel');
function mostrar(qual){
 const ehRel = qual==='rel';
 abaEditor.setAttribute('aria-selected', String(!ehRel));
 abaRel.setAttribute('aria-selected', String(ehRel));
 document.getElementById('paneEditor').classList.toggle('oculto', ehRel);
 document.getElementById('paneRel').classList.toggle('oculto', !ehRel);
 if(ehRel){ renderRelatorio(); requestAnimationFrame(ajustarEscala); }
 window.scrollTo(0,0);
}
abaEditor.addEventListener('click', ()=>mostrar('editor'));
abaRel.addEventListener('click', ()=>mostrar('rel'));

/* ============================================================
   10. EXPORTAÇÃO
   ============================================================ */
function nomeArquivo(ext){
 const c = estado.config;
 return `RDO_${(c.dataRelatorio||'').replace(/-/g,'')}_${c.turno||''}.${ext}`;
}
function baixar(url, nome){
 const a = document.createElement('a');
 a.href = url; a.download = nome;
 document.body.appendChild(a); a.click(); a.remove();
}

/* PNG via SVG/foreignObject: funciona offline e sem biblioteca externa.
   Não há imagem externa nem fonte remota no relatório, então o canvas
   não é contaminado e o toDataURL funciona. Se o navegador recusar
   (Safari antigo tem limitações com foreignObject), cai no caminho
   de impressão, que sempre funciona. */
document.getElementById('btPng').addEventListener('click', async ()=>{
 mostrar('rel');
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const no = document.getElementById('relatorio');
 const L = 1000, A = no.scrollHeight;
 try{
  const css = document.getElementById('estilos').textContent;
  const conteudo = new XMLSerializer().serializeToString(no);
  const svg =
   `<svg xmlns="http://www.w3.org/2000/svg" width="${L*2}" height="${A*2}" viewBox="0 0 ${L} ${A}">`+
   `<foreignObject x="0" y="0" width="${L}" height="${A}">`+
   `<div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${conteudo}</div>`+
   `</foreignObject></svg>`;
  const img = new Image();
  img.decoding = 'sync';
  await new Promise((ok,err)=>{
   img.onload = ok; img.onerror = ()=>err(new Error('foreignObject recusado'));
   img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
  const cv = document.createElement('canvas');
  cv.width = L*2; cv.height = A*2;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#eef2f6'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  baixar(cv.toDataURL('image/png'), nomeArquivo('png'));
 }catch(err){
  console.error('Exportação PNG indisponível neste navegador:', err);
  alert('Este navegador não conseguiu gerar o PNG.\n\nUse "Salvar PDF" — na tela de impressão escolha "Salvar em PDF" (ou tire um print da aba Relatório).');
 }
});

document.getElementById('btPdf').addEventListener('click', ()=>{ mostrar('rel'); setTimeout(()=>window.print(), 250); });

document.getElementById('btJson').addEventListener('click', ()=>{
 const url = 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(estado,null,1));
 baixar(url, nomeArquivo('json'));
});
document.getElementById('arqJson').addEventListener('change', e=>{
 const f = e.target.files && e.target.files[0];
 if(!f) return;
 const fr = new FileReader();
 fr.onload = ()=>{
  try{
   const novo = JSON.parse(fr.result);
   if(!novo || !Array.isArray(novo.sondas)) throw new Error('formato');
   estado = {...clonar(ESTADO_PADRAO), ...novo, config:{...ESTADO_PADRAO.config, ...(novo.config||{})}};
   salvar(); renderEditor(); renderRelatorio();
   alert('Backup importado.');
  }catch(err){ alert('Arquivo inválido — esperado um backup gerado por este app.'); }
 };
 fr.readAsText(f);
 e.target.value = '';
});

/* ============================================================
   11. SERVICE WORKER (modo offline)
   ============================================================ */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load', ()=>{
  navigator.serviceWorker.register('./sw.js?v=3', {updateViaCache:'none'})
   .catch(err=>console.error('RDO: modo offline indisponível neste dispositivo.', err));
 });
}

/* ============================================================
   12. INICIALIZAÇÃO
   ============================================================ */
renderEditor();
renderRelatorio();
mostrar('editor');

})();
</script>
